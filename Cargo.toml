[workspace]
members = [
    "accounting",
    "accounting-sql",
    "accounting-service",
    "accounting-cli",
    "accounting-api",
    "accounting-beancount",
    "accounting-auth",
]
resolver = "3"

# 风格门控：内联命名格式参数、impl 块内用 Self
[workspace.lints.clippy]
uninlined_format_args = "deny"
use_self = "deny"

# 发布构建调优：性能优先、保留 panic 信息（panic/opt-level 保持默认 unwind/3）
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
accounting.path = "accounting"
accounting-sql.path = "accounting-sql"
accounting-service.path = "accounting-service"
accounting-auth.path = "accounting-auth"

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
rust_decimal = "1.42"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
rust-i18n = "4.1"
